name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and upload
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Packaging/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Packaging/Info.plist

      - name: Build Apple Silicon app
        run: |
          ./build.sh --arch arm64
          ditto -c -k --keepParent "build/PDF Oven.app" "PDF-Oven-${GITHUB_REF_NAME}.zip"

      - name: Build Intel app
        run: |
          ./build.sh --arch x86_64
          ditto -c -k --keepParent "build/PDF Oven.app" "PDF-Oven-${GITHUB_REF_NAME}-intel.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "PDF-Oven-${GITHUB_REF_NAME}.zip" \
            "PDF-Oven-${GITHUB_REF_NAME}-intel.zip"
