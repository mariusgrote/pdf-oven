name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and upload
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Packaging/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Packaging/Info.plist

      - name: Build app bundle
        run: ./build.sh

      - name: Zip app bundle
        run: ditto -c -k --keepParent "build/PDF Oven.app" "PDF-Oven-${GITHUB_REF_NAME}.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "PDF-Oven-${GITHUB_REF_NAME}.zip"
