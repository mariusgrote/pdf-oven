name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble app bundle
        run: ./build.sh
      - name: Run tests with bundled qpdf
        run: |
          PDFOVEN_TEST_QPDF="$PWD/build/PDF Oven.app/Contents/Helpers/qpdf" \
            DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer swift test
